<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康钦宇 · 赛博空间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    color: #e0e0ff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(120,80,255,.12), transparent),
      radial-gradient(ellipse 60% 50% at 80% 70%, rgba(0,200,255,.10), transparent);
    pointer-events: none;
  }
  .card {
    text-align: center;
    padding: 3rem 2rem;
    position: relative;
    z-index: 1;
  }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    background: linear-gradient(135deg, #7b5cff, #00d4ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
    box-shadow: 0 0 40px rgba(123,92,255,.4);
  }
  h1 {
    font-size: 2.2rem;
    letter-spacing: .3em;
    margin-bottom: .6rem;
    background: linear-gradient(90deg, #b48cff, #7be9ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    color: #8a8aa3;
    font-size: .95rem;
    letter-spacing: .2em;
    margin-bottom: 2rem;
  }
  .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .links a {
    color: #c9c9ea;
    text-decoration: none;
    border: 1px solid rgba(139,140,255,.3);
    padding: .6rem 1.4rem;
    border-radius: 999px;
    font-size: .9rem;
    transition: all .25s;
  }
  .links a:hover {
    border-color: #7b5cff;
    box-shadow: 0 0 18px rgba(123,92,255,.35);
    transform: translateY(-2px);
  }
  .foot {
    margin-top: 2.5rem;
    color: #55556e;
    font-size: .75rem;
    letter-spacing: .15em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">康</div>
    <h1>康钦宇</h1>
    <div class="sub">赛博宗主 · 技术折腾中</div>
    <div class="links">
      <a href="https://ynaifeier.com" target="_blank">公司官网</a>
      <a href="mailto:2551127381@qq.com">联系我</a>
    </div>
    <div class="foot">DEPLOYED ON VERCEL · 2026</div>
  </div>
</body>
</html>
